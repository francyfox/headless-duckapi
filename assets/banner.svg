<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="headless-duckapi banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161d29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd338"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

  <circle cx="985" cy="150" r="108" fill="#ffd338" opacity="0.06"/>
  <circle cx="985" cy="150" r="76" fill="#ffd338" opacity="0.07"/>

  <text x="80" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="86" font-weight="700" fill="#f0f6fc" letter-spacing="1">headless-duckapi</text>
  <rect x="84" y="156" width="230" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#8b949e">DuckDuckGo AI Chat (duck.ai) as a Telegram bot — GPT, Claude, Mistral,</text>
  <text x="80" y="240" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#8b949e">streaming, image generation, vision. Pure JS protocol client, self-hosted.</text>

  <text x="985" y="196" font-size="120" text-anchor="middle">&#129425;</text>
</svg>
